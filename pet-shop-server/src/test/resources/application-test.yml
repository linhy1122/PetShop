# 测试环境配置
spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:petshop_test;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
  redis:
    host: ${REDIS_HOST:localhost}
    port: 6379
  jackson:
    default-property-inclusion: non_null

ai:
  api-key: test-key
  api-url: http://localhost:9999/mock-ai

wechat:
  mini-program:
    app-id: test-app-id
    app-secret: test-app-secret

github:
  oauth:
    client-id: test-id
    client-secret: test-secret
    redirect-uri: http://localhost:9090/callback

pet-shop:
  upload:
    path: ./target/test-uploads/
